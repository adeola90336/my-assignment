<!DOCTYPE html>
<html>
<head>
    <title>3D Rotating Car</title>

    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #151515;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script>

// 1. CREATE THE SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151515);


// 2. CREATE THE CAMERA
const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(5, 3, 6);
camera.lookAt(0, 0, 0);


// 3. CREATE THE RENDERER
const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);


// 4. ADD LIGHTING
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 8, 5);
scene.add(light);

const ambientLight = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambientLight);


// 5. CREATE THE CAR
const car = new THREE.Group();


// Car body
const body = new THREE.Mesh(
    new THREE.BoxGeometry(4, 0.8, 1.8),
    new THREE.MeshStandardMaterial({
        color: 0xffffff,
        metalness: 0.5,
        roughness: 0.3
    })
);

body.position.y = 0.8;
car.add(body);


// Car roof
const roof = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.8, 1.5),
    new THREE.MeshStandardMaterial({
        color: 0xffffff
    })
);

roof.position.set(0, 1.5, 0);
car.add(roof);


// Car windows
const windows = new THREE.Mesh(
    new THREE.BoxGeometry(2.05, 0.6, 1.52),
    new THREE.MeshStandardMaterial({
        color: 0x182b40,
        metalness: 0.3,
        roughness: 0.2
    })
);

windows.position.set(0, 1.5, 0);
car.add(windows);


// 6. CREATE THE FOUR WHEELS
const wheels = [];

function createWheel(x, z) {

    const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.5, 0.3, 32),
        new THREE.MeshStandardMaterial({
            color: 0x111111
        })
    );

    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(x, 0.5, z);

    car.add(wheel);
    wheels.push(wheel);
}

createWheel(-1.3, 1);
createWheel(1.3, 1);
createWheel(-1.3, -1);
createWheel(1.3, -1);


// 7. ADD HEADLIGHTS AND REAR LIGHTS
function createLight(x, z, color) {

    const lamp = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.2, 0.4),
        new THREE.MeshStandardMaterial({
            color: color,
            emissive: color
        })
    );

    lamp.position.set(x, 0.8, z);
    car.add(lamp);
}

// Front lights
createLight(2, -0.5, 0xffffcc);
createLight(2, 0.5, 0xffffcc);

// Rear lights
createLight(-2, -0.5, 0xff0000);
createLight(-2, 0.5, 0xff0000);


// Add car to scene
scene.add(car);


// 8. CREATE THE GROUND
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({
        color: 0x333333
    })
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
scene.add(ground);


// 9. ANIMATE THE CAR
function animate() {

    requestAnimationFrame(animate);

    // Rotate the car
    car.rotation.y += 0.01;

    // Rotate the wheels
    wheels.forEach(function(wheel) {
        wheel.rotation.z += 0.05;
    });

    // Display the animation
    renderer.render(scene, camera);
}

animate();


// 10. ADJUST SCREEN SIZE
window.addEventListener("resize", function() {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
